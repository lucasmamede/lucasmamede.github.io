<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101613">
  <meta name="description" content="Meu Financeiro • Estúdio, uma segunda proposta do aplicativo com dados demonstrativos isolados.">
  <title>Meu Financeiro — Estúdio (Teste 2)</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./rules.js" defer></script>
  <script src="./seed.js" defer></script>
  <script src="./engine.js" defer></script>
  <script src="./tests.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="demo-ribbon"><span class="demo-ribbon-dot"></span> SEGUNDA PROPOSTA · AMBIENTE DE TESTES <span class="ribbon-right">Dados fictícios · Sem conexão com o banco real</span></div>
  <header class="site-header">
    <div class="header-content">
      <button type="button" class="brand" data-page="home" aria-label="Meu Financeiro - Início">
        <span class="brand-mark"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M5 23L13 15L20 21L31 9" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 9H31V17" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></span>
        <span><b>meu<span class="brand-green">.</span>financeiro</b><small>seu dinheiro, sem complicação</small></span>
      </button>
      <nav class="desktop-nav" aria-label="Menu principal">
        <button type="button" data-page="home" class="active">Visão geral</button>
        <button type="button" data-page="activity">Lançamentos</button>
        <button type="button" data-page="agenda">Agenda</button>
        <button type="button" data-page="cards">Cartões</button>
        <button type="button" data-page="investments">Investimentos</button>
        <div class="more-wrap">
          <button type="button" id="moreButton" data-action="more" aria-haspopup="true" aria-expanded="false">Mais <span class="chevron">⌄</span></button>
          <div class="more-menu hidden" id="moreMenu">
            <button type="button" data-page="accounts">Minhas contas</button>
            <button type="button" data-page="subscriptions">Assinaturas</button>
            <button type="button" data-page="settings">Configurações</button>
          </div>
        </div>
      </nav>
      <div class="header-right">
        <button type="button" class="theme-toggle" data-action="theme" aria-label="Alternar tema claro ou escuro" title="Alternar tema"><span id="themeGlyph">☀</span></button>
        <button type="button" class="header-add" data-create="transaction">＋ <span>Adicionar</span></button>
      </div>
    </div>
  </header>
  <main class="main" id="main" tabindex="-1"></main>
  <footer class="footer container">Meu Financeiro · Proposta 02 <span>•</span> Apenas demonstração <span>•</span> Seus dados reais não são utilizados</footer>
  <nav class="mobile-nav" aria-label="Navegação para celular">
    <button data-page="home" type="button" class="active"><span class="mobile-icon">⌂</span><span>Início</span></button>
    <button data-page="activity" type="button"><span class="mobile-icon">↕</span><span>Lançamentos</span></button>
    <button data-create="transaction" class="mobile-plus" aria-label="Adicionar" type="button">＋</button>
    <button data-page="agenda" type="button"><span class="mobile-icon">▦</span><span>Agenda</span></button>
    <button data-action="mobileMore" type="button"><span class="mobile-icon">☰</span><span>Mais</span></button>
  </nav>
  <div class="backdrop hidden" id="sheetBackdrop">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-header"><div><div class="eyebrow" id="sheetEyebrow">NOVO REGISTRO</div><h2 id="sheetTitle">Adicionar</h2></div><button type="button" class="icon-control" data-action="close" aria-label="Fechar">✕</button></div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>É necessário ativar o JavaScript para usar esta demonstração.</noscript>
</body>
</html>
